spring.application.name=Loan Management System

spring.datasource.url=jdbc:mysql://localhost:3306/springDemo
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.root=INFO
logging.level.com.example.loan_management_system=DEBUG

#Spring will automatically log all unhandled exceptions for you:
server.error.include-exception=true
server.error.include-message=always
logging.level.org.springframework.web=DEBUG

logging.level.org.springframework.security=DEBUG

# JWT Configuration

jwt.secret=${JWT_SECRET}
# Access token validity: 15 minutes
jwt.expiration-ms=900000
#Refresh token: 7 days
security.jwt.refresh-expiration-ms=604800000
jwt.issuer=loan-management-system