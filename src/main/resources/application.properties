spring.application.name=Loan Management System

spring.datasource.url=jdbc:mysql://localhost:3306/springDemo
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.example.loan_management_system=DEBUG

#Spring will automatically log all unhandled exceptions for you:
server.error.include-exception=true
server.error.include-message=always
logging.level.org.springframework.web=DEBUG